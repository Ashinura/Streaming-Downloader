<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Streaming-Downloader</title>
        <link rel="shortcut icon" href="{{ url_for('static', filename='img/str_dl-logo.ico') }}" type="image/x-icon">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/menu.css') }}">
        <script defer src="{{ url_for('static', filename='scripts/menu.js') }}"></script>
    </head>
    <body>
        <div class="main-container">
            <div class="url-container">
                <input type="url" class="url-input">
            </div>
        </div>

        <div class="desktop-nav">
            <a class="nav-btn" title="{{ trad('settings') }}" href="{{ url_for('config.renderConfig') }}">
                <img src="https://cdn-icons-png.flaticon.com/512/13330/13330760.png" alt="{{ trad('settings') }}">
            </a>
            <button class="nav-btn" title="{{ trad('destination_path') }}">
                <img src="https://cdn-icons-png.flaticon.com/512/8316/8316636.png" alt="{{ trad('destination_path') }}">
            </button>
            <a class="nav-btn" title="{{ trad('dev_page') }}" href="https://github.com/Ashinura" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968866.png" alt="{{ trad('dev_page') }}" style="border-radius: 100%;">
            </a>
        </div>

        <div class="bottom-right">
            {% if update_available %}
                <div class="update-trigger" onclick="confirmUpdate('{{ update_available }}')" title="Mise à jour {{ update_available }} disponible">
                    <svg viewBox="0 0 24 24" width="20" height="20" class="icon-update">
                        <path d="M21 11a1 1 0 0 1-1 1H4a1 1 0 0 1 0-2h17a1 1 0 0 1 1 1zM4 7a1 1 0 0 1 0-2h17a1 1 0 0 1 0 2H4zm0 10a1 1 0 0 1 0-2h11a1 1 0 0 1 0 2H4z" fill="currentColor"/>
                        <path d="M12 18l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            {% endif %}
            <div class="logo-container">
                <div class="logo">
                    <img src="{{ url_for('static', filename='img/str_dl-logo.ico') }}" alt="logo">
                </div>
                <span class="version" id="version">{{ version }}</span>
            </div>
        </div>

        <div class="mobile-nav">
            <div class="mobile-menu" id="mobileMenu">
                <div class="mobile-menu-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/126/126472.png" alt="{{ trad('settings') }}">
                    <span>{{ trad('settings') }}</span>
                </div>
                <div class="mobile-menu-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png" alt="{{ trad('destination_path') }}">
                    <span>{{ trad('destination_path') }}</span>
                </div>
                <div class="mobile-menu-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="{{ trad('dev_page') }}">
                    <span>{{ trad('dev_page') }}</span>
                </div>
            </div>
            <button class="burger-btn" id="burgerBtn">
                <div class="burger-line"></div>
                <div class="burger-line"></div>
                <div class="burger-line"></div>
            </button>
        </div>
    </body>
</html>
